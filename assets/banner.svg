<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Weather Forecasting banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#14224d"/>
      <stop offset="1" stop-color="#1b5fa8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.6" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="48" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="110" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="36" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70" r="1.1" opacity="0.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="28" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun glow -->
  <g transform="translate(985 120)">
    <circle r="120" fill="url(#sun)" opacity="0.55" filter="url(#blur)"/>
    <circle r="52" fill="url(#sun)"/>
    <circle r="34" fill="#ffd36e"/>
    <g stroke="#ffd36e" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <line x1="0" y1="-62" x2="0" y2="-80"/>
      <line x1="0" y1="62" x2="0" y2="80"/>
      <line x1="-62" y1="0" x2="-80" y2="0"/>
      <line x1="62" y1="0" x2="80" y2="0"/>
      <line x1="44" y1="44" x2="57" y2="57"/>
      <line x1="-44" y1="-44" x2="-57" y2="-57"/>
      <line x1="44" y1="-44" x2="57" y2="-57"/>
      <line x1="-44" y1="44" x2="-57" y2="57"/>
    </g>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffffff">
    <g opacity="0.92">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="900" cy="190" rx="78" ry="30"/>
      <ellipse cx="860" cy="172" rx="44" ry="32"/>
      <ellipse cx="925" cy="165" rx="52" ry="36"/>
    </g>
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" dur="18s" repeatCount="indefinite"/>
      <ellipse cx="1090" cy="238" rx="70" ry="24"/>
      <ellipse cx="1055" cy="224" rx="38" ry="26"/>
      <ellipse cx="1115" cy="220" rx="42" ry="28"/>
    </g>
  </g>

  <!-- title -->
  <text x="70" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="1">Weather Forecasting</text>
  <text x="72" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#bfe3ff">Multi-model ensemble  •  Severe weather alerts  •  Self-scoring accuracy</text>

  <!-- model chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    <rect x="72" y="232" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="131" y="254" text-anchor="middle">ECMWF IFS</text>
    <rect x="202" y="232" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="266" y="254" text-anchor="middle">ECMWF AIFS</text>
    <rect x="342" y="232" width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="383" y="254" text-anchor="middle">GFS</text>
    <rect x="436" y="232" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="480" y="254" text-anchor="middle">ICON</text>
  </g>
</svg>
